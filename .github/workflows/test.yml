name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to 24.18.0: Node 24.19.0 has a teardown regression that trips
          # `Assertion failed: (env) != nullptr` in RemoveEnvironmentCleanupHook when better-sqlite3's
          # native Statement finalizers run on process exit, crashing session-resume-recovery.test.js
          # (every assertion passes — only the exit crashes). Bump deliberately once upstream fixes it.
          node-version: '24.18.0'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Run tests
        run: npm test
