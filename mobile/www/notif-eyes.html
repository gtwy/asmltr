<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>notify</title>
<style>
  :root{ --v:139 92 246; --p:236 72 153; --c:34 211 238; }
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
    font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#e9e9f2;
    -webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;justify-content:center;align-items:flex-start;padding-top:8px}
  .toast{display:flex;align-items:center;gap:12px;max-width:94%;padding:11px 16px 11px 12px;border-radius:20px;
    background:rgba(18,18,28,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid #ffffff24;box-shadow:0 18px 50px -14px #000, 0 0 30px rgb(var(--v)/.25);
    transform:translateY(-160%);opacity:0;transition:transform .5s cubic-bezier(.2,1.35,.35,1), opacity .35s ease}
  .toast.show{transform:translateY(0);opacity:1}
  /* the eyes: a small glowing orb halo + two expressive pill-eyes (same language as the in-app orb) */
  .face{position:relative;width:40px;height:40px;flex:none;display:grid;place-items:center}
  .halo{position:absolute;inset:-40%;border-radius:50%;filter:blur(10px);opacity:.85;
    background:radial-gradient(circle at 50% 45%, rgb(var(--v)/.9), rgb(var(--p)/.4) 55%, transparent 72%)}
  .eyes{position:relative;z-index:2;display:flex;gap:7px}
  .eye{width:11px;height:16px;border-radius:6px;
    background:linear-gradient(180deg,#f2ecff,#b79bff 60%,#7de8ff);
    box-shadow:0 0 8px rgb(var(--v)/.9), inset 0 -2px 4px rgb(var(--c)/.5)}
  .txt{min-width:0;line-height:1.28;font-size:13.5px}
  .txt .who{font-weight:700;color:#c4b5fd;margin-right:6px}
  .txt .body{color:#e9e9f2;opacity:.95;display:block;overflow:hidden;text-overflow:ellipsis;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
</style></head>
<body>
  <div id="wrap">
    <div class="toast" id="toast">
      <span class="face"><span class="halo"></span><span class="eyes"><i class="eye" id="eyeL"></i><i class="eye" id="eyeR"></i></span></span>
      <span class="txt"><span class="body" id="body">…</span></span>
    </div>
  </div>
<script>
  // message comes in as ?msg=<urlencoded>. The native overlay controls the lifetime (auto-dismiss),
  // but we also self-hide after a while as a fallback if shown standalone.
  const p = new URLSearchParams(location.search);
  document.getElementById('body').textContent = p.get('msg') || '';
  const toast = document.getElementById('toast');
  requestAnimationFrame(() => requestAnimationFrame(() => toast.classList.add('show')));
  // gentle life: blink + a soft happy squish on the eyes
  const eyes = [document.getElementById('eyeL'), document.getElementById('eyeR')];
  let t = 0, nextBlink = 55;
  (function loop(){
    t++;
    let h = 16;
    if (--nextBlink <= 0) { h = 3; if (nextBlink < -4) nextBlink = 80 + Math.random()*120; }
    for (const e of eyes) e.style.height = h + 'px';
    requestAnimationFrame(loop);
  })();
  // Called by native to animate out before removal.
  window.dismissEyes = () => { toast.classList.remove('show'); };
</script>
</body></html>
