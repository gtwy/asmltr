<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>eyes</title>
<style>
  :root{ --v:139 92 246; --p:236 72 153; --c:34 211 238; }
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
    -webkit-user-select:none;user-select:none;pointer-events:none}
  /* Just the eyes — a soft floating glow + two expressive pill-eyes. No card, no text: it should read as
     a little presence hovering over the screen, not a notification banner. */
  #face{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.4);opacity:0;
    transition:transform .55s cubic-bezier(.2,1.5,.4,1), opacity .4s ease;
    display:grid;place-items:center;width:200px;height:200px}
  #face.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .halo{position:absolute;inset:0;border-radius:50%;filter:blur(26px);opacity:.9;
    background:radial-gradient(circle at 50% 45%, rgb(var(--v)/.85), rgb(var(--p)/.4) 52%, transparent 70%)}
  .halo.b{inset:8%;filter:blur(16px);opacity:.7;animation:spin 9s linear infinite;
    background:radial-gradient(circle at 55% 55%, rgb(var(--c)/.5), transparent 68%)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .eyes{position:relative;z-index:2;display:flex;gap:22px}
  .eye{width:30px;height:44px;border-radius:16px;
    background:linear-gradient(180deg,#f4efff,#b79bff 58%,#7de8ff);
    box-shadow:0 0 22px rgb(var(--v)/.95), 0 0 44px rgb(var(--p)/.5), inset 0 -5px 9px rgb(var(--c)/.55)}
</style></head>
<body>
  <div id="face">
    <span class="halo"></span><span class="halo b"></span>
    <span class="eyes"><i class="eye" id="eyeL"></i><i class="eye" id="eyeR"></i></span>
  </div>
<script>
  // The native overlay controls lifetime (auto-dismiss); we animate in, live-blink + gently bob, and
  // expose dismissEyes() so native can fade us out before removing the window.
  const face = document.getElementById('face');
  const eyes = [document.getElementById('eyeL'), document.getElementById('eyeR')];
  requestAnimationFrame(() => requestAnimationFrame(() => face.classList.add('show')));
  let t = 0, nextBlink = 45;
  (function loop(){
    t++;
    // blink: squish the eyes closed briefly, then re-open
    let h = 44;
    if (--nextBlink <= 0) { h = 5; if (nextBlink < -4) nextBlink = 70 + Math.random()*140; }
    for (const e of eyes) e.style.height = h + 'px';
    // gentle floating bob + a slow look-around drift
    const bob = Math.sin(t/38)*5, lookX = Math.sin(t/70)*4;
    if (!face.classList.contains('out'))
      face.style.transform = `translate(calc(-50% + ${lookX}px), calc(-50% + ${bob}px)) scale(1)`;
    requestAnimationFrame(loop);
  })();
  window.dismissEyes = () => { face.classList.add('out'); face.classList.remove('show'); };
</script>
</body></html>
